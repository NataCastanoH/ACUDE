<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mito o Derecho Arcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: consola que se adapta a la pantalla, en vertical pantalla arriba y controles abajo, acostada controles a los lados */
:root {
  /* Paleta Musgo (predeterminada), el juego la cambia desde el menú Colores */
  --page: #121a15;
  --shell: #2a3a30;
  --shell-hi: #34473b;
  --shell-lo: #1f2c24;
  --bezel: #18221c;
  --lime: #b5c48a;
  --lime-lo: #8a9868;
  --lime-hi: #d3ddb0;
  --btn-shadow: #56603f;
  --ink-shell: #a9b8ab;
  --lcd0: #2c3527;
  --lcd1: #5f6b52;
  --lcd2: #a7b08f;
  --lcd3: #c9d1b6;
  --red: #9c4a3c;
  --grid: rgba(44,53,39,.06);
  --shade: rgba(44,53,39,.25);
  --pixel: "Press Start 2P", "Courier New", monospace;
  --lcd: "VT323", "Courier New", monospace;
  /* Tamaños que crecen o se encogen con la pantalla */
  --cell: clamp(28px, min(5.2vh, 10.5vw), 44px);
  --btn: clamp(48px, min(9vh, 18vw), 78px);
  --fs: clamp(19px, min(3.3vh, 6.6vw), 28px);
  --fs-sm: clamp(17px, min(2.7vh, 5.4vw), 22px);
  --px: clamp(7px, min(1.25vh, 2.4vw), 9px);
  --px-big: clamp(12px, min(2.3vh, 4.4vw), 17px);
  --m: 3px;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink-shell);
  font-family: var(--lcd);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap {
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-block: clamp(4px, 1.2vh, 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.console {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100%;
  max-height: 940px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: minmax(0, 1fr) auto auto;
  grid-template-areas: "screen screen" "brand brand" "left right";
  padding: clamp(8px, 1.6vh, 16px) clamp(10px, 3vw, 16px) clamp(10px, 1.8vh, 18px);
  border-radius: 22px 22px 64px 22px;
  background: linear-gradient(160deg, var(--shell-hi), var(--shell) 45%, var(--shell-lo));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.07), inset 0 -5px 0 rgba(0,0,0,.35), 0 24px 50px rgba(0,0,0,.55);
}
.bezel {
  grid-area: screen;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: clamp(6px, 1.2vh, 10px) clamp(10px, 3vw, 16px) clamp(10px, 1.8vh, 16px);
  border-radius: 12px 12px 36px 12px;
  background: var(--bezel);
}
.bezel-top { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
.mascot { width: calc(var(--m) * 18); height: calc(var(--m) * 12); image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
.wordmark { flex: 1; min-width: 0; display: grid; gap: 4px; }
.wordmark b { font-family: var(--pixel); font-weight: 400; font-size: clamp(8px, 1.4vh, 11px); color: var(--lime); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say { font-family: var(--pixel); font-size: 7px; line-height: 1.3; color: var(--ink-shell); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say.hot { color: var(--lime); }
a.menu-item { text-decoration: none; }
.menu-item .sw { margin-left: auto; display: flex; flex: none; border: 2px solid currentColor; }
.menu-item .sw i { display: block; width: 13px; height: 22px; }
.menu-btn {
  flex: none;
  min-height: 36px; min-width: 44px; padding: 0 12px;
  border: 2px solid var(--lime-lo); border-radius: 999px;
  background: transparent; color: var(--lime);
  font-family: var(--pixel); font-size: 8px; letter-spacing: .06em;
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none; appearance: none;
}
.menu-btn:active { background: var(--lime); color: var(--bezel); }
.menu-btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.share-text { margin: 0; padding: 8px; border: 2px dashed var(--lcd0); font-family: var(--lcd); font-size: var(--fs-sm); line-height: 1.05; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .45; } }

.lcd {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 4px;
  background: var(--lcd3);
  color: var(--lcd0);
  box-shadow: inset 0 0 0 3px var(--lcd2), inset 0 8px 18px var(--shade);
}
.lcd::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 3px);
}
.hud {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 7px 9px;
  border-bottom: 2px solid var(--lcd1);
  font-family: var(--pixel); font-size: var(--px); line-height: 1.3;
  font-variant-numeric: tabular-nums;
  min-height: 28px;
}
.hud > span { min-width: 0; }
.dots, .hearts { display: flex; gap: 3px; align-items: center; flex: none; }
.dot { width: 9px; height: 9px; border: 2px solid var(--lcd0); }
.dot.done { background: var(--lcd0); }
.dot.wrong { background: var(--red); border-color: var(--red); }
.dot.now { background: var(--lcd2); animation: blink 1s steps(2) infinite; }
.hearts svg.off { opacity: .28; }
.hearts .x { margin-left: 2px; }
@keyframes blink { 50% { opacity: .2; } }

.screen {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 10px 11px 14px;
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1.2vh, 10px);
  scrollbar-width: thin;
  scrollbar-color: var(--lcd1) transparent;
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }

.eb { font-family: var(--pixel); font-size: var(--px); line-height: 1.6; letter-spacing: .05em; color: var(--lcd1); text-transform: uppercase; }
.big { font-family: var(--pixel); font-size: var(--px-big); line-height: 1.4; margin: 0; text-wrap: balance; }
.txt { font-size: var(--fs); line-height: 1.02; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; }
.sm { font-size: var(--fs-sm); line-height: 1.05; margin: 0; color: var(--lcd1); }
.inv { background: var(--lcd0); color: var(--lcd3); padding: 4px 6px; align-self: flex-start; }
.tag { font-family: var(--pixel); font-size: var(--px); line-height: 1.5; border: 2px solid var(--lcd0); padding: 4px 6px; align-self: flex-start; }

.logo { display: grid; gap: 6px; justify-items: start; margin-top: 2px; }
.logo .m { font-family: var(--pixel); font-size: clamp(20px, min(4.2vh, 8vw), 32px); line-height: 1; text-shadow: 3px 3px 0 var(--lcd2); }
.logo .o { font-family: var(--pixel); font-size: 11px; background: var(--lcd0); color: var(--lcd3); padding: 5px 7px; }
.logo .d { font-family: var(--pixel); font-size: clamp(15px, min(3.1vh, 6vw), 24px); line-height: 1; text-shadow: 3px 3px 0 var(--lcd2); }
.blinker { animation: blink 1.1s steps(2) infinite; }
.rules { display: grid; gap: 4px; border: 2px dashed var(--lcd1); padding: 8px; }

.menu { display: grid; gap: 6px; }
.menu-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  min-height: 44px;
  padding: 6px 10px;
  border: 2px solid var(--lcd0);
  border-radius: 0;
  background: transparent;
  color: var(--lcd0);
  font-family: var(--lcd);
  font-size: var(--fs);
  line-height: 1.02;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
}
.menu-item small { display: block; font-size: var(--fs-sm); color: inherit; opacity: .75; }
.menu-item::before { content: ""; flex: none; width: 9px; height: 12px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); opacity: 0; }
.menu-item.sel { background: var(--lcd0); color: var(--lcd3); }
.menu-item.sel::before { opacity: 1; }
.menu-item:focus-visible { outline: 3px dashed var(--lcd1); outline-offset: 2px; }

.timer { display: grid; gap: 4px; }
.bar { height: 10px; border: 2px solid var(--lcd0); padding: 1px; position: relative; }
.bar i { display: block; height: 100%; width: 100%; background: var(--lcd1); }
.bar .goal { position: absolute; top: -5px; bottom: -5px; left: 50%; width: 3px; background: var(--lcd0); }
.meta { display: flex; justify-content: space-between; gap: 8px; font-family: var(--pixel); font-size: var(--px); color: var(--lcd1); }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.choice {
  display: grid; justify-items: center; align-content: center; gap: 4px;
  min-height: clamp(48px, 8vh, 64px); padding: 6px;
  border: 3px solid var(--lcd0); border-radius: 0;
  background: var(--lcd2); color: var(--lcd0);
  font-family: var(--pixel); font-size: clamp(9px, min(1.6vh, 3vw), 12px); line-height: 1.3;
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none; appearance: none;
}
.choice small { font-size: 7px; color: var(--lcd1); min-height: 9px; }
.choice:active, .choice.sel { background: var(--lcd0); color: var(--lcd3); }
.choice.sel small { color: var(--lcd2); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--pixel); font-size: var(--px); line-height: 1.4; border: 2px solid var(--lcd0); padding: 4px 6px; }
.chip.on { background: var(--lcd0); color: var(--lcd3); }
.chip.lost { border-color: var(--red); color: var(--red); }

.rows { display: grid; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 2px dashed var(--lcd1); font-size: var(--fs-sm); line-height: 1; font-variant-numeric: tabular-nums; }
.row > span { min-width: 0; }
.row .k { font-family: var(--pixel); font-size: var(--px); }
.row .icons { display: flex; gap: 3px; align-items: center; flex: none; }

.pts { font-family: var(--pixel); font-size: clamp(22px, min(4.6vh, 9vw), 36px); line-height: 1; margin: 0; font-variant-numeric: tabular-nums; text-shadow: 3px 3px 0 var(--lcd2); }
.pts small { font-size: 11px; text-shadow: none; }
.badges { display: grid; gap: 6px; }
.badge { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; }
.badge b { font-family: var(--pixel); font-size: var(--px); font-weight: 400; display: block; margin-bottom: 2px; }
.badge span { font-size: var(--fs-sm); line-height: 1; color: var(--lcd1); }
svg.px { display: block; shape-rendering: crispEdges; flex: none; }

.ally { display: grid; gap: 6px; border: 3px solid var(--lcd0); padding: 10px; }
.ally .name { font-family: var(--pixel); font-size: var(--px-big); background: var(--lcd0); color: var(--lcd3); padding: 6px 8px; justify-self: start; }

.ini { display: flex; justify-content: center; gap: 12px; margin: 4px 0; }
.slot { display: grid; justify-items: center; gap: 2px; }
.slot button { width: 52px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; color: var(--lcd0); cursor: pointer; touch-action: manipulation; }
.slot .ch { width: 50px; height: 54px; display: grid; place-items: center; font-family: var(--pixel); font-size: 22px; border: 3px solid var(--lcd0); }
.slot.sel .ch { background: var(--lcd0); color: var(--lcd3); }

.pop { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-family: var(--pixel); font-size: 18px; color: var(--lcd0); text-shadow: 2px 2px 0 var(--lcd3); animation: popup 1s steps(8) forwards; white-space: nowrap; }
@keyframes popup { to { transform: translate(-50%, -70px); opacity: 0; } }
.bit { position: absolute; width: 8px; height: 8px; left: 50%; top: 45%; animation: burst .9s steps(9) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)); opacity: 0; } }
.shake { animation: shake .3s steps(4); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.brandline { grid-area: brand; display: flex; justify-content: flex-start; gap: 10px; align-items: baseline; padding: clamp(4px, 1vh, 10px) 6px 0; font-family: var(--pixel); font-size: 9px; font-style: italic; color: var(--lime); letter-spacing: .04em; }
.brandline span:last-child { font-size: 7px; color: var(--ink-shell); font-style: normal; }

.left, .right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(2px, .8vh, 8px); padding-top: clamp(6px, 1.4vh, 14px); }
.left { grid-area: left; justify-self: start; }
.right { grid-area: right; justify-self: end; }

.dpad { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(3, var(--cell)); flex: none; }
.dpad button { border: 0; background: var(--bezel); color: var(--ink-shell); display: grid; place-items: center; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; padding: 0; -webkit-appearance: none; appearance: none; }
.dpad .u { grid-area: 1 / 2; border-radius: 6px 6px 0 0; }
.dpad .l { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }
.dpad .c { grid-area: 2 / 2; background: var(--bezel); }
.dpad .r { grid-area: 2 / 3; border-radius: 0 6px 6px 0; }
.dpad .d { grid-area: 3 / 2; border-radius: 0 0 6px 6px; }
.dpad button:active { background: #000; }
.dpad button:focus-visible, .ab button:focus-visible, .pill button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

.ab { position: relative; width: calc(var(--btn) * 2.25); height: calc(var(--btn) * 1.85); flex: none; transform: rotate(-18deg); }
.abtn { position: absolute; display: grid; justify-items: center; gap: 4px; }
.abtn.b { left: 0; bottom: 2px; }
.abtn.a { right: 0; top: 0; }
.ab button {
  width: var(--btn); height: var(--btn); border-radius: 50%; border: 0;
  background: radial-gradient(circle at 35% 30%, var(--lime-hi), var(--lime) 45%, var(--lime-lo));
  color: var(--bezel);
  font-family: var(--pixel); font-size: calc(var(--btn) * .22);
  box-shadow: 0 5px 0 var(--btn-shadow), 0 8px 14px rgba(0,0,0,.4);
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none; appearance: none;
  transition: transform .06s, box-shadow .06s;
}
.ab button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-shadow), 0 3px 6px rgba(0,0,0,.4); }
.ab button:disabled { filter: grayscale(.8) brightness(.55); cursor: default; }
.abtn span { font-family: var(--pixel); font-size: 8px; color: var(--lime); min-height: 9px; white-space: nowrap; }

.pill { display: grid; justify-items: center; gap: 1px; }
.pill button { width: 72px; height: clamp(28px, 4.5vh, 40px); border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none; }
.pill button::before { content: ""; width: 52px; height: 13px; border-radius: 8px; background: var(--bezel); box-shadow: inset 0 -2px 0 rgba(255,255,255,.08); }
.pill button:active::before { background: #000; }
.pill span { font-family: var(--pixel); font-size: 7px; color: var(--ink-shell); letter-spacing: .06em; white-space: nowrap; }

/* Pantallas bajitas en vertical */
@media (max-height: 720px) { :root { --m: 2px; } }
@media (max-height: 640px) and (orientation: portrait) {
  .brandline { display: none; }
}
/* Celular acostado o ventanas muy bajitas: controles a los lados */
@media (orientation: landscape) and (max-height: 620px) {
  :root {
    --cell: clamp(28px, 9.5vh, 46px);
    --btn: clamp(48px, 17vh, 78px);
    --fs: clamp(18px, 5.4vh, 26px);
    --fs-sm: clamp(16px, 4.4vh, 21px);
    --px: clamp(7px, 1.9vh, 9px);
    --px-big: clamp(11px, 3.6vh, 16px);
  }
  .console {
    max-width: 980px;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
    grid-template-areas: "left screen right";
    gap: clamp(10px, 2.5vw, 24px);
    border-radius: 26px 26px 60px 26px;
  }
  .brandline { display: none; }
  .left, .right { justify-self: center; padding-top: 0; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<script>

  {

    text: "Alguien comparte un meme que se burla del acento de una compañera y varios reaccionan con risas",
    options: [

      { profile: "activa", label: "Escribo en el grupo algo como \"mejor sin burlas, parceros\"",

let audio = null, soundOn = true;
try { soundOn = localStorage.getItem("moda-sound") !== "off"; } catch (e) {}
function tone(f, s, d, v) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "square";
  o.frequency.setValueAtTime(f, s);
  g.gain.setValueAtTime(0.0001, s);
  g.gain.linearRampToValueAtTime(v || 0.06, s + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, s + d);
  o.connect(g).connect(audio.destination);
  o.start(s); o.stop(s + d + 0.05);
}
function sfx(kind) {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime + 0.01;
    const seq = (notes, step, dur, v) => notes.forEach((f, k) => tone(f, t + k * step, dur, v));
    if (kind === "ok") seq([523, 659, 784, 1047], 0.07, 0.12);
    else if (kind === "bad") seq([392, 330, 262], 0.12, 0.16, 0.07);
    else if (kind === "over") seq([392, 349, 330, 294, 262], 0.16, 0.2, 0.07);
    else if (kind === "choice") seq([523, 784], 0.08, 0.14);
    else if (kind === "win") seq([523, 659, 784, 1047, 784, 1047], 0.1, 0.18);
    else if (kind === "move") tone(660, t, 0.03, 0.035);
    else tone(880, t, 0.045, 0.045);
  } catch (e) {}
}

const MUSIC_VOL = 0.22, MUSIC_DUCK = 0.07;

/* Tema principal en menú, nivel 1 y resultados, y otro tema en el nivel 2 */
const TRACKS = { tema: "tema.mp3", nivel2: "nivel2.mp3", victoria: "victoria.mp3" };
let nextTrack = null;
const tracks = {};
let curTrack = "tema", musicLevel = MUSIC_VOL;
Object.keys(TRACKS).forEach(k => {
  const a = new Audio();
  a.loop = true;
  a.preload = "auto";
  tracks[k] = { el: a, gain: null, ready: false };
  fetch(TRACKS[k])
    .then(r => r.ok ? r.blob() : Promise.reject())
    .then(b => { a.src = URL.createObjectURL(b); })
    .catch(() => { a.src = TRACKS[k]; })
    .finally(() => { tracks[k].ready = true; if (musicWanted && k === curTrack) playMusic(); });
});
function graphFor(t) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { t.el.volume = musicLevel; return; }
    audio = audio || new AC();
    if (audio.state === "suspended") audio.resume();
    if (!t.gain) {
      const src = audio.createMediaElementSource(t.el);
      t.gain = audio.createGain();
      t.gain.gain.value = musicLevel;
      src.connect(t.gain).connect(audio.destination);
    }
  } catch (e) { t.el.volume = musicLevel; }
}
function musicVol(v) {
  musicLevel = v;
  Object.values(tracks).forEach(t => {
    if (t.gain && audio) t.gain.gain.setTargetAtTime(v, audio.currentTime, 0.15);
    else { try { t.el.volume = v; } catch (e) {} }
  });
}
function stopAll() { Object.values(tracks).forEach(t => t.el.pause()); }
function playMusic() {
  musicWanted = true;
  const t = tracks[curTrack];
  if (!musicOn || !t.ready || document.hidden) return;
  Object.keys(tracks).forEach(k => { if (k !== curTrack) tracks[k].el.pause(); });
  graphFor(t);
  const p = t.el.play();
  if (p && p.catch) p.catch(() => {});
}
function setTrack(k) {
  if (k === curTrack) return;
  curTrack = k;
  try { tracks[k].el.currentTime = 0; } catch (e) {}
  if (musicWanted) playMusic();
}
function setMusic(on) {
  musicOn = on;
  try { localStorage.setItem("moda-music", on ? "on" : "off"); } catch (e) {}
  if (on) playMusic(); else stopAll();
}
const musicLabel = () => "MÚSICA: " + (musicOn ? "SÍ" : "NO");

function award(p, ok, t) {
  levelAnswers++;
  if (!ok) {
    streaks[p] = 0; stats[p].miss++;
    const o = owner(p);
    if (lives[o] > 0) lives[o]--;
    return { ok, total: 0, speed: 0, streak: 0, lost: true };
  }
  levelCorrect++;
  streaks[p]++;
  stats[p].correct++;
  if (t < 3) stats[p].fast = true;
  const speed = Math.round(SPEED_MAX * Math.max(0, 1 - t / TIME));
  const streak = STREAK_STEP * (streaks[p] - 1);
  const total = BASE + speed + streak;
  scores[p] += total;
  return { ok, total, speed, streak };
}

function answer(v) {
  const t = stopTimer();
  H = {};
  if (players === 1) {
    const r = award(0, v === ITEMS[i].answer, t);
    results[i] = r.ok;
    feedbackSingle(r);
  } else {
    picks[cur] = v; times[cur] = t;
    sfx("tap");
    const nx = nextActive(cur);
    if (nx >= 0) { const prev = cur; cur = nx; pass(prev); } else reveal();
  }
}

}

function reveal() {
  const item = ITEMS[i];
  const played = [];
  for (let k = 0; k < players; k++) if (picks[k] !== undefined) played.push(k);
  const rs = {};
  played.forEach(k => { rs[k] = award(k, picks[k] === item.answer, times[k]); });
  const count = played.filter(k => rs[k].ok).length;
  results[i] = count * 2 >= played.length;
  cur = 0;
  clear(); hud();
  screen.appendChild(el("div", "eb", "Nivel 1 · Afirmación " + (i + 1) + "/" + ITEMS.length + " · Resultado"));
  screen.appendChild(el("p", "big", count === played.length ? "¡TODOS ACERTARON!" : count === 0 ? "ESTA VEZ NADIE" : "ACERTARON " + count + " DE " + played.length));
  screen.appendChild(el("span", "tag", item.answer === "mito" ? "ES UN MITO" : "ES UN DERECHO"));
  screen.appendChild(el("p", "txt", item.why));
  const rows = el("div", "rows");

function badgesFor(list) {
  const s = list.reduce((a, p) => ({ correct: a.correct + stats[p].correct, miss: a.miss + stats[p].miss, fast: a.fast || stats[p].fast }), { correct: 0, miss: 0, fast: false });
  const out = [];
  if (s.miss === 0 && s.correct > 0) out.push(BADGES.perfecto);
  if (s.fast) out.push(BADGES.rayo);
  if (s.miss > 0) out.push(BADGES.aprendiz);
  if (mode === "coop") out.push(BADGES.equipo);
  out.push(BADGES.aliado);
  return out;
}

function results_() {
  phase = "end";
  /* Bono por vidas que quedan */
  const lifeBonus = lives.map(l => l * LIFE_PTS);
  if (mode === "coop") scores[0] += lifeBonus[0];
  else lifeBonus.forEach((b, p) => { scores[p] += b; });
  nextTrack = "victoria";
  clear(); hud();
  let save = [];

  if (mode === "versus") {
    const queue = scores.map((s, k) => ({ p: k, pts: s, label: pname(k) })).sort((a, b) => b.pts - a.pts || a.p - b.p);
    screen.appendChild(el("div", "eb", "Ranking del grupo"));
    const top = queue[0].pts;
    const leaders = queue.filter(q => q.pts === top);
    screen.appendChild(el("p", "big", leaders.length === players ? "¡EMPATE ENTRE TODOS!" : leaders.length > 1 ? "EMPATE " + leaders.map(q => q.label).join(" Y ") : "¡GANA " + leaders[0].label + "!"));
    const rows = el("div", "rows");
    queue.forEach(q => {
      const place = queue.findIndex(x => x.pts === q.pts) + 1;

      const left = el("span", "");
      left.appendChild(el("span", "k", place + "º " + q.label + " "));
      left.appendChild(el("span", "sm", rankTitle(q.pts).toLowerCase()));
      const right = el("span", "icons");
      badgesFor([q.p]).forEach(b => right.appendChild(svgIcon(b.icon, 12)));
      right.appendChild(el("span", "k", " " + q.pts));
      row.appendChild(left); row.appendChild(right);
      rows.appendChild(row);
    });
    screen.appendChild(rows);
    screen.appendChild(el("p", "sm", "Incluye +" + LIFE_PTS + " por cada vida que le quedó a cada jugador"));
    save = queue.filter(q => qualifies(q.pts));
  } else {
    const total = team();
    screen.appendChild(el("div", "eb", mode === "coop" ? "Resultado del equipo" : "Resultado final"));
    bigPoints(total, screen);
    const perHead = mode === "coop" ? Math.round(total / players) : total;
    screen.appendChild(el("span", "big inv", rankTitle(perHead)));
    const c = el("div", "chips");
    c.appendChild(el("span", "chip", "+" + lifeBonus[0] + " BONO VIDAS"));
    if (mode === "coop") c.appendChild(el("span", "chip", perHead + " PTS POR JUGADOR"));
    screen.appendChild(c);
    badgeList(mode === "coop" ? [...Array(players).keys()] : [0], screen);
    if (qualifies(total)) save = [{ p: 0, pts: total, label: mode === "coop" ? "EQUIPO" : "J1", coop: mode === "coop", title: rankTitle(perHead) }];
  }

  allyCard(screen);
  if (!musicOn) sfx("win");
  burst();
  const prof = allyProfile(sceneChoices);
  eco("cheer", "¡PERFIL " + prof.name + "!", 4000);

  const best = mode === "versus" ? Math.max(...scores) : team();
  const msg = [
    (players === 1 ? "Mi perfil" : mode === "coop" ? "El perfil de nuestro equipo" : "El perfil de nuestro grupo") + " de aliado en Mito o Derecho es " + prof.name,
    prof.phrase,
    "Para mañana: " + prof.action,
    players === 1 ? "Hice " + best + " puntos" : mode === "coop" ? "Hicimos " + best + " puntos en equipo" : "El mejor puntaje fue " + best,
    "¿Te le mides? Juega aquí: " + GAME_URL
  ].join("\n");

  const items = [];
  items.push({ label: "COMPARTIR POR WHATSAPP", hint: "Envía el perfil de aliado", href: "https://wa.me/?text=" + encodeURIComponent(msg) });
  items.push({ label: "COPIAR MENSAJE", act: () => copyMsg(msg) });
  if (save.length) items.push({ label: save.length > 1 ? "GUARDAR RÉCORDS" : "GUARDAR RÉCORD", act: () => initials(save, 0) });
  items.push({ label: "JUGAR OTRA VEZ", act: title });
  items.push({ label: "VER RÉCORDS", act: records });
  menu(items, screen);
  setAB(null, ["A", "ELEGIR"]);
}

function copyMsg(msg) {
  const show = () => {
    if (!document.getElementById("share-text")) {
      const pre = el("pre", "share-text", msg);
      pre.id = "share-text";
      screen.appendChild(pre);
    }
    document.getElementById("share-text").scrollIntoView({ block: "nearest" });
    eco("idle", "SELECCIONA Y COPIA");
  };
  try {
    if (!navigator.clipboard) return show();
    navigator.clipboard.writeText(msg).then(() => eco("happy", "¡MENSAJE COPIADO!", 2500), show);
  } catch (e) { show(); }
}

function countUp(node, to) {
  const t0 = performance.now();
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / 1000);
    node.textContent = Math.round(to * k);
    if (k < 1) requestAnimationFrame(step);
  };
  step();
}

/* ================= Iniciales para récords ================= */
const ABC = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
function initials(queue, idx) {
  const q = queue[idx];
  const letters = [0, 0, 0];
  let slot = 0;
  nextTrack = "victoria";
  clear(); hud();
  screen.appendChild(el("div", "eb", "Nuevo récord"));
  screen.appendChild(el("p", "big", q.label + " · " + q.pts + " PTS"));
  screen.appendChild(el("p", "sm", "Escriban tres letras, pueden ser inventadas, con la cruz o tocando los triángulos"));
  const box = el("div", "ini");
  const slots = letters.map((_, k) => {
    const s = el("div", "slot");
    const up = el("button"); up.type = "button"; up.id = "ini-up-" + k; up.setAttribute("aria-label", "Letra anterior"); up.appendChild(svgIcon("up", 22));
    const ch = el("div", "ch");
    const dn = el("button"); dn.type = "button"; dn.id = "ini-dn-" + k; dn.setAttribute("aria-label", "Letra siguiente"); dn.appendChild(svgIcon("down", 22));
    up.addEventListener("click", () => { slot = k; change(-1); });
    dn.addEventListener("click", () => { slot = k; change(1); });
    ch.addEventListener("click", () => { slot = k; paint(); sfx("move"); });
    s.appendChild(up); s.appendChild(ch); s.appendChild(dn);
    box.appendChild(s);
    return { s, ch };
  });
  screen.appendChild(box);
  const paint = () => slots.forEach((o, k) => { o.ch.textContent = ABC[letters[k]]; o.s.classList.toggle("sel", k === slot); });
  const change = d => { letters[slot] = (letters[slot] + ABC.length + d) % ABC.length; paint(); sfx("move"); };
  paint();
  H.up = () => change(-1);
  H.down = () => change(1);
  H.left = () => { slot = (slot + 2) % 3; paint(); sfx("move"); };
  H.right = () => { slot = (slot + 1) % 3; paint(); sfx("move"); };
  const done = () => idx + 1 < queue.length ? initials(queue, idx + 1) : records();
  H.a = () => {
    const r = loadRecs();
    const ttl = (q.title || rankTitle(q.pts)) + (q.coop ? " · equipo" : "");
    r.push({ ini: letters.map(n => ABC[n]).join(""), pts: q.pts, title: ttl });
    r.sort((a, b) => b.pts - a.pts);
    saveRecs(r.slice(0, 5));
    sfx("win"); eco("cheer", "¡NUEVO RÉCORD!", 2500);
    done();
  };
  H.b = () => { sfx("tap"); done(); };
  setAB(["B", "SALTAR"], ["A", "GUARDAR"]);
}

/* ================= Récords ================= */
function records() {
  phase = "title";
  clear(); hud();
  screen.appendChild(el("div", "eb", "Récords de este celular"));
  const head = el("div", "");
  head.style.display = "flex"; head.style.alignItems = "center"; head.style.gap = "10px";
  head.appendChild(svgIcon("cup", 28));
  head.appendChild(el("p", "big", "TOP 5"));
  screen.appendChild(head);
  const r = loadRecs();
  if (!r.length) {
    screen.appendChild(el("p", "txt", "Todavía no hay récords, jueguen una partida y escriban sus iniciales al final"));
  } else {
    const rows = el("div", "rows");
    r.forEach((x, k) => {
      const row = el("div", "row");
      const left = el("span", "");
      left.appendChild(el("span", "k", (k + 1) + "º " + x.ini + " "));
      left.appendChild(el("span", "sm", x.title.toLowerCase()));
      row.appendChild(left);
      row.appendChild(el("span", "k", String(x.pts)));
      rows.appendChild(row);
    });
    screen.appendChild(rows);
  }
  setAB(["B", "VOLVER"], ["A", "JUGAR"]);
  H.a = H.b = H.start = () => { sfx("tap"); title(); };
}

};
let curPal = "musgo";
function applyPalette(k, persist) {
  const p = PALETTES[k] || PALETTES.musgo;
  curPal = PALETTES[k] ? k : "musgo";
  Object.keys(p).forEach(t => { if (t !== "name" && t !== "hint") document.documentElement.style.setProperty("--" + t, p[t]); });
  if (persist) { try { localStorage.setItem("moda-palette", curPal); } catch (e) {} }
  eco.recolor();
}
function colorsScreen(box, back) {
  const keys = Object.keys(PALETTES), start = curPal;
  stopTimer();
  H = {};
  box.innerHTML = "";
  box.scrollTop = 0;
  box.appendChild(el("div", "eb", "Colores"));
  box.appendChild(el("p", "big", "ELIGE UNA PALETA"));
  box.appendChild(el("p", "sm", "Mueve la cruz para probar cada una, se guarda en este celular"));
  menu(keys.map(k => {
    const p = PALETTES[k];
    return { label: p.name, hint: p.hint, swatch: [p.lcd3, p.lcd2, p.lcd1, p.lcd0], act: () => { applyPalette(k, true); eco("happy", "COLORES " + p.name); back(); } };
  }), box, "pal-", { start: Math.max(0, keys.indexOf(start)), onMove: n => applyPalette(keys[n]) });
  setAB(["B", "VOLVER"], ["A", "ELEGIR"]);
  H.b = () => { sfx("tap"); applyPalette(start); back(); };
  eco("idle", "PRUEBA LOS COLORES");
}

let savedPal = "musgo";
try { savedPal = localStorage.getItem("moda-palette") || "musgo"; } catch (e) {}
applyPalette(savedPal);
paintSound();
title();
