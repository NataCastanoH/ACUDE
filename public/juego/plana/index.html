<script>
/* Lo que comparten las dos versiones (contenido, reglas, funciones y la hoja de Google)
   vive en juego/contenido.js; aquí queda solo lo propio de la versión plana */
const J = window.JUEGO;
const CONFIG = Object.assign({}, J, {
  personaje: "",                           // Sábado 10-12: personaje y tono, se vota; vacío mientras tanto
  bienvenida: "No te pregunto lo que sabes\nte pregunto lo que harías",
  version: "v0.3",
  // Música de fondo, la misma de la versión arcade
  musica: {
    tema: "/ACUDE/juego/arcade/tema.mp3",
    nivel2: "/ACUDE/juego/arcade/nivel2.mp3",
    victoria: "/ACUDE/juego/arcade/victoria.mp3"
  }
});

const AYUDA = J.ayuda;
</script>
<style>
:root{
  --fondo:#0F1C16; --sup:#182A22; --sup2:#21382D; --lima:#D7F65A; --texto:#F4F7F1; --suave:#A9B8AE; --borde:#2C4638; --rojo:#F08A6C;
  --base:17px;
}
body.accesible{ --fondo:#000; --sup:#111; --sup2:#1d1d1d; --lima:#E4FF6B; --texto:#fff; --suave:#e6e6e6; --borde:#fff; --rojo:#FF9C80; --base:21px }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fondo);color:var(--texto)}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:var(--base);line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding:18px 16px 110px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.marca{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;cursor:pointer;background:none;border:0;color:inherit;font:inherit;font-weight:800;padding:0;min-width:0}
.marca span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cuadro{width:22px;height:22px;background:var(--lima);border-radius:5px;position:relative;flex:none}
.cuadro:after{content:"";position:absolute;left:9px;top:5px;width:4px;height:12px;background:var(--fondo);border-radius:1px}
.ver{font-size:.75em;color:var(--suave);border:1px solid var(--borde);padding:3px 9px;border-radius:99px;white-space:nowrap}
.btn-acc{background:none;border:1px solid var(--borde);color:var(--texto);border-radius:99px;padding:4px 10px;font:inherit;font-size:.8em;cursor:pointer;min-height:32px}
.btn-acc.lleno{background:var(--lima);color:var(--fondo);border-color:var(--lima);font-weight:800}
.voz{display:flex;align-items:center;gap:8px;font-size:.85em;color:var(--suave);margin-bottom:16px;min-height:1.4em}
.voz b{color:var(--texto)}
.voz .punto{width:8px;height:8px;border-radius:50%;background:var(--lima);box-shadow:0 0 8px var(--lima);flex:none;animation:late 2.4s ease-in-out infinite}
.voz.feliz #dice{color:var(--lima);font-weight:600;animation:salta .5s ease}
.voz.triste #dice{color:var(--rojo);font-weight:600}
@keyframes late{50%{opacity:.4}}
@keyframes salta{30%{transform:translateY(-4px)}}
h1{font-size:clamp(2.6em,13vw,3.6em);line-height:.92;font-weight:800;letter-spacing:-.04em;margin:8px 0 14px}
h1 .l{color:var(--lima)}
h2{font-size:1.5em;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:14px;white-space:pre-line}
.lead{font-size:1.15em;color:var(--suave);white-space:pre-line;margin-bottom:24px}
.btn{display:block;width:100%;text-align:left;font:inherit;font-weight:600;padding:16px 18px;border-radius:16px;border:1px solid var(--borde);background:var(--sup);color:var(--texto);cursor:pointer;margin-bottom:10px;transition:transform .12s, background .2s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.marca:focus-visible,.btn-acc:focus-visible,.letra button:focus-visible{outline:3px solid var(--lima);outline-offset:2px}
.btn.prim{background:var(--lima);color:var(--fondo);border-color:var(--lima);font-weight:800;font-size:1.1em}
.btn.sel{border-color:var(--lima);cursor:default}
.btn small{display:block;font-weight:400;opacity:.75;font-size:.82em;margin-top:2px}
.btn .der{float:right;font-weight:800;color:var(--lima)}
.btn.prim .der{color:var(--fondo)}
.tarjeta{background:var(--sup);border:1px solid var(--borde);border-radius:20px;padding:20px;margin-bottom:14px}
.tarjeta.borde{border-color:var(--lima)}
.etq{display:inline-block;font-size:.72em;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--lima);margin-bottom:10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .btn{text-align:center;font-size:1.1em;font-weight:800}
.dos.chica .btn{font-size:1em;font-weight:600;padding:14px 10px}
.resp{border-radius:16px;padding:16px;margin:6px 0 14px;background:var(--sup2);border-left:4px solid var(--lima);white-space:pre-line;animation:sube .3s ease}
.resp.mal{border-left-color:var(--rojo)}
.resp b{display:block;margin-bottom:4px}
.ruta{font-size:.85em;color:var(--suave);margin-top:8px}
.ok{color:var(--lima)}
.mal-t{color:var(--rojo)}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.perfil{font-size:3em;font-weight:800;color:var(--lima);letter-spacing:-.03em;line-height:1}
.creditos{font-size:.8em;color:var(--suave);margin-top:auto;padding-top:24px;border-top:1px solid var(--borde)}
.creditos li{list-style:none;margin-top:3px}
.faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq details{border-bottom:1px solid var(--borde)}
.faq details p{white-space:pre-line;padding:0 0 14px;color:var(--suave)}
input.buscar{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:1px solid var(--borde);background:var(--sup2);color:var(--texto);margin-bottom:8px}
.ayuda{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 32px);max-width:488px;background:var(--texto);color:var(--fondo);border:none;border-radius:99px;padding:14px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.hoja{background:var(--sup);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px 30px;animation:sube .25s;max-height:90vh;overflow-y:auto}
.hoja a{color:var(--lima)}
.hoja .it{padding:12px 0;border-bottom:1px solid var(--borde)}
.nota{font-size:.75em;color:var(--suave);margin-top:14px}
.volver{display:block;background:none;border:none;color:var(--suave);font:inherit;cursor:pointer;margin-bottom:10px;padding:8px 0;min-height:44px}
.chip-rec{display:inline-block;font-size:.8em;color:var(--suave);border:1px dashed var(--borde);border-radius:99px;padding:4px 12px;margin:-10px 0 20px}

/* Marcador: puntos, avance y vidas */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:600;font-variant-numeric:tabular-nums}
.vidas{display:flex;gap:3px;align-items:center}
.vidas svg{width:18px;height:16px;fill:var(--lima)}
.vidas svg.off{fill:var(--sup2)}
.avance{display:flex;gap:4px;margin-bottom:16px}
.avance i{flex:1;height:6px;border-radius:9px;background:var(--sup2)}
.avance i.bien{background:var(--lima)}
.avance i.mal{background:var(--rojo)}
.avance i.ahora{background:var(--suave);animation:late 1s ease-in-out infinite}
.reloj{margin-bottom:14px}
.reloj .t{display:flex;justify-content:space-between;font-size:.75em;color:var(--suave);margin-bottom:4px}
.reloj .barra{height:8px;background:var(--sup2);border-radius:9px;overflow:hidden}
.reloj .barra i{display:block;height:100%;width:100%;background:var(--lima);border-radius:9px}
.meta{display:flex;justify-content:space-between;font-size:.8em;color:var(--suave);margin:4px 0 14px}
.medidor{height:12px;background:var(--sup2);border-radius:9px;position:relative;margin:10px 0 4px}
.medidor i{display:block;height:100%;background:var(--lima);border-radius:9px;transition:width .6s}
.medidor .linea{position:absolute;top:-5px;bottom:-5px;left:50%;width:3px;background:var(--texto);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:.8em;font-weight:600;border:1px solid var(--borde);border-radius:99px;padding:4px 10px}
.chip.on{background:var(--lima);color:var(--fondo);border-color:var(--lima)}
.chip.perdida{border-color:var(--rojo);color:var(--rojo)}
.filas{margin:8px 0 12px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde);font-variant-numeric:tabular-nums}
.fila b{font-weight:800}
.fila span.s{color:var(--suave);font-size:.85em}
.puntos{font-size:3.4em;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--lima);font-variant-numeric:tabular-nums}
.puntos small{font-size:.3em;color:var(--suave);letter-spacing:0;font-weight:600}
.rango{display:inline-block;background:var(--lima);color:var(--fondo);font-weight:800;border-radius:10px;padding:4px 10px;margin:10px 0 12px}
.insignias{display:grid;gap:10px;margin:6px 0 4px}
.insignia{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.insignia .ic{width:34px;height:34px;border-radius:10px;background:var(--sup2);display:grid;place-items:center;color:var(--lima)}
.insignia .ic svg{width:20px;height:20px;fill:currentColor}
.insignia b{display:block;font-size:.9em}
.insignia span{font-size:.85em;color:var(--suave)}
.letras{display:flex;justify-content:center;gap:12px;margin:8px 0 18px}
.letra{display:grid;justify-items:center;gap:4px}
.letra button{width:56px;height:44px;border-radius:12px;border:1px solid var(--borde);background:var(--sup2);color:var(--texto);font:inherit;font-size:1.1em;cursor:pointer}
.letra .c{width:56px;height:64px;border-radius:14px;border:2px solid var(--borde);display:grid;place-items:center;font-size:2em;font-weight:800}
.letra.sel .c{border-color:var(--lima);color:var(--lima)}
.muestras{display:flex;margin-left:auto;border-radius:8px;overflow:hidden;border:1px solid var(--borde);flex:none}
.muestras i{width:14px;height:26px;display:block}
.btn.color{display:flex;align-items:center;gap:12px}
.btn.color .nom{flex:1}
.reglas{margin:0 0 18px;padding-left:20px;color:var(--suave)}
.reglas li{margin-bottom:6px}
.compartido{white-space:pre-wrap;font-size:.9em;background:var(--sup2);border:1px dashed var(--borde);border-radius:14px;padding:12px;margin-bottom:10px;user-select:text;-webkit-user-select:text}

/* Efectos */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.salto{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-weight:800;font-size:2.2em;color:var(--lima);text-shadow:0 4px 20px rgba(0,0,0,.5);animation:flota 1s ease forwards}
@keyframes flota{to{transform:translate(-50%,-70px);opacity:0}}
.pieza{position:fixed;left:50%;top:42%;width:9px;height:9px;border-radius:3px;animation:estalla .9s ease-out forwards}
@keyframes estalla{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.tiembla{animation:tiembla .3s}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="marca" id="marca" type="button"><span class="cuadro"></span><span id="marcaNombre"></span></button>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn-acc" id="btnAcc" type="button" hidden aria-label="Letra grande y alto contraste">Aa</button>
      <button class="btn-acc lleno" id="btnMenu" type="button" hidden>Menú</button>
      <span class="ver" id="ver"></span>
    </div>
  </header>
  <p class="voz" aria-live="polite"><span class="punto"></span><b id="quien"></b><span id="dice"></span></p>
  <main id="vista"></main>
  <main id="pausa" hidden></main>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>
<button class="ayuda" id="btnAyuda" type="button">¿Necesitas ayuda ahora?</button>
<div class="modal" id="modal">
  <div class="hoja" id="hojaAyuda"></div>
</div>

<script>
let DATOS = J.filas;
const R = CONFIG.reglas;
const $ = s => document.querySelector(s);
const partes = t => (t||"").split("||").map(x=>x.trim()).filter(Boolean);
const esc = t => String(t||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const de = tipo => DATOS.filter(r => (r.tipo||"").toLowerCase().trim()===tipo && (r.estado||"").toLowerCase()!=="descartada");
const quieto = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const guardar = (k, v) => { try { localStorage.setItem("juego-" + k, v); } catch (e) {} };
const leer = k => { try { return localStorage.getItem("juego-" + k); } catch (e) { return null; } };

async function cargarHoja(){
  if (await J.cargar()) { DATOS = J.filas; $("#ver").textContent = CONFIG.version + " · en vivo"; }
}

/* ================= Piezas de la pantalla ================= */
function h(tag, attrs, ...hijos){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "on") n.addEventListener("click", v);
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of hijos.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const boton = (texto, sub, fn, cls) => h("button", { class: "btn" + (cls ? " " + cls : ""), type: "button", on: () => { sfx("tap"); fn(); } }, texto, sub ? h("small", {}, sub) : null);
const tarjeta = (...hijos) => h("div", { class: "tarjeta" }, ...hijos);
const etq = t => h("span", { class: "etq" }, t);
const NS = "http://www.w3.org/2000/svg";
function icono(d, cls){
  const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); if (cls) s.setAttribute("class", cls);
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); s.appendChild(p); return s;
}
const ICONOS = {
  corazon: "M12 21s-7.5-4.6-10-9.3C.4 8.5 2.2 4.5 6 4.5c2.2 0 3.6 1.2 4.5 2.6h3C14.4 5.7 15.8 4.5 18 4.5c3.8 0 5.6 4 4 7.2C19.5 16.4 12 21 12 21z",
  estrella: "M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z",
  rayo: "M13 2L4 14h6l-1 8 9-12h-6z",
  mas: "M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v4h4v2h-4v4h-2v-4H7v-2h4V7z",
  equipo: "M8 11a3.5 3.5 0 110-7 3.5 3.5 0 010 7zm8 0a3.5 3.5 0 110-7 3.5 3.5 0 010 7zM1 20c0-3.3 3.1-6 7-6s7 2.7 7 6zm14.6 0c-.2-2.3-1.3-4.2-3-5.5.9-.3 1.9-.5 3.4-.5 3.9 0 7 2.7 7 6z"
};

function pantalla(...nodos){
  pararReloj();
  $("#vista").replaceChildren(...nodos.flat().filter(Boolean));
  window.scrollTo(0, 0);
  cabecera();
  pista(siguientePista || (fase === "dilemas" ? "nivel2" : "tema"));
  siguientePista = null;
}

/* ================= Personaje ================= */
let vozTimer = 0;
function voz(estado, texto, ms){
  const v = $(".voz");
  $("#quien").textContent = CONFIG.personaje;
  if (texto != null) $("#dice").textContent = texto;
  v.classList.remove("feliz", "triste"); void v.offsetWidth;
  if (estado !== "calma") v.classList.add(estado);
  clearTimeout(vozTimer);
  if (estado !== "calma") vozTimer = setTimeout(() => v.classList.remove("feliz", "triste"), ms || 1500);
}
function salto(texto){
  const n = h("div", { class: "salto" }, texto);
  $("#fx").appendChild(n); setTimeout(() => n.remove(), 1100);
}
function confeti(){
  if (quieto()) return;
  const cols = ["var(--lima)", "var(--texto)", "var(--suave)"];
  for (let k = 0; k < 24; k++) {
    const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 120;
    const p = h("i", { class: "pieza" });
    p.style.setProperty("--x", Math.round(Math.cos(a) * r) + "px");
    p.style.setProperty("--y", Math.round(Math.sin(a) * r) + "px");
    p.style.background = cols[k % 3];
    $("#fx").appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
function temblor(){
  if (quieto()) return;
  const t = $("#vista .tarjeta"); if (!t) return;
  t.classList.remove("tiembla"); void t.offsetWidth; t.classList.add("tiembla");
}

/* ================= Sonido ================= */
let audio = null, efectos = leer("efectos") !== "no";
function tono(f, s, d, v){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "square";
  o.frequency.setValueAtTime(f, s);
  g.gain.setValueAtTime(0.0001, s);
  g.gain.linearRampToValueAtTime(v || 0.06, s + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, s + d);
  o.connect(g).connect(audio.destination);
  o.start(s); o.stop(s + d + 0.05);
}
function sfx(tipo){
  if (!efectos) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime + 0.01;
    const sec = (notas, paso, dur, v) => notas.forEach((f, k) => tono(f, t + k * paso, dur, v));
    if (tipo === "bien") sec([523, 659, 784, 1047], 0.07, 0.12);
    else if (tipo === "mal") sec([392, 330, 262], 0.12, 0.16, 0.07);
    else if (tipo === "fin") sec([392, 349, 330, 294, 262], 0.16, 0.2, 0.07);
    else if (tipo === "elige") sec([523, 784], 0.08, 0.14);
    else if (tipo === "gana") sec([523, 659, 784, 1047, 784, 1047], 0.1, 0.18);
    else if (tipo === "mueve") tono(660, t, 0.03, 0.035);
    else tono(880, t, 0.045, 0.045);
  } catch (e) {}
}

/* Música de fondo: tema en el inicio y el nivel 1, otra en el nivel 2 y otra en los resultados */
const VOL = 0.22, VOL_BAJO = 0.07;
let musica = leer("musica") !== "no", musicaPedida = false, pistaActual = "tema", siguientePista = null, volumen = VOL;
const pistas = {};
Object.keys(CONFIG.musica).forEach(k => {
  const a = new Audio(); a.loop = true; a.preload = "auto";
  pistas[k] = { el: a, gain: null, lista: false };
  fetch(CONFIG.musica[k])
    .then(r => r.ok ? r.blob() : Promise.reject())
    .then(b => { a.src = URL.createObjectURL(b); })
    .catch(() => { a.src = CONFIG.musica[k]; })
    .finally(() => { pistas[k].lista = true; if (musicaPedida && k === pistaActual) sonar(); });
});
function conectar(p){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { p.el.volume = volumen; return; }
    audio = audio || new AC();
    if (audio.state === "suspended") audio.resume();
    if (!p.gain) {
      const src = audio.createMediaElementSource(p.el);
      p.gain = audio.createGain(); p.gain.gain.value = volumen;
      src.connect(p.gain).connect(audio.destination);
    }
  } catch (e) { p.el.volume = volumen; }
}
function bajarMusica(v){
  volumen = v;
  Object.values(pistas).forEach(p => {
    if (p.gain && audio) p.gain.gain.setTargetAtTime(v, audio.currentTime, 0.15);
    else { try { p.el.volume = v; } catch (e) {} }
  });
}
const callar = () => Object.values(pistas).forEach(p => p.el.pause());
function sonar(){
  musicaPedida = true;
  const p = pistas[pistaActual];
  if (!musica || !p || !p.lista || document.hidden) return;
  Object.keys(pistas).forEach(k => { if (k !== pistaActual) pistas[k].el.pause(); });
  conectar(p);
  const x = p.el.play(); if (x && x.catch) x.catch(() => {});
}
function pista(k){
  if (k === pistaActual || !pistas[k]) return;
  pistaActual = k;
  try { pistas[k].el.currentTime = 0; } catch (e) {}
  if (musicaPedida) sonar();
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { if (!musicaPedida) sonar(); }, { once: true }));
document.addEventListener("visibilitychange", () => { if (document.hidden) callar(); else if (musicaPedida) sonar(); });

const dueno = p => modo === "coop" ? 0 : p;
const puedeJugar = p => vidas[dueno(p)] > 0;
const sinVidas = () => vidas.every(v => v <= 0);
const equipo = () => puntos.reduce((a, b) => a + b, 0);
const jn = k => "J" + (k + 1);
function siguienteActivo(desde){ for (let p = desde + 1; p < jug; p++) if (puedeJugar(p)) return p; return -1; }

function corazones(n, max){

function marcador(){

let raf = 0, tInicio = 0, relojBarra = null, relojOn = false, pausadoEn = 0;
function correrReloj(){
  const vuelta = () => {
    const queda = Math.max(0, 1 - (performance.now() - tInicio) / 1000 / R.segundos);
    relojBarra.style.width = queda * 100 + "%";
    if (queda > 0) raf = requestAnimationFrame(vuelta); else relojOn = false;
  };
  vuelta();
}
function arrancarReloj(barra){ relojBarra = barra; tInicio = performance.now(); relojOn = true; correrReloj(); }
function pararReloj(){ cancelAnimationFrame(raf); relojOn = false; return (performance.now() - tInicio) / 1000; }

function lineaMeta(){

}

function reiniciar(){
  puntos = Array(jug).fill(0);
  rachas = Array(jug).fill(0);
  stats = Array.from({ length: jug }, () => ({ bien: 0, mal: 0, rapido: false }));
  maxVidas = J.vidasDe(modo, jug);
  vidas = Array(modo === "coop" ? 1 : jug).fill(maxVidas);
  ronda = J.nuevaRonda();
  i = 0; elecciones = []; tiempos = []; resultados = [];
  aciertosNivel = 0; respuestasNivel = 0;
  j = 0; dilemasHechos = []; votos = {};
  turno = 0;
}
function empezar(n, m){
  jug = n; modo = m; enInicio = false;
  reiniciar();
  if (!ronda.mitos.length) return nivel2();
  pregunta();
}

/* ================= Nivel 1: mito o derecho ================= */
function pregunta(){
  fase = "mitos";
  const r = ronda.mitos[i];
  const barra = h("i");
  const ops = h("div", { class: "dos" }, boton("Mito", null, () => responder("mito")), boton("Derecho", null, () => responder("derecho")));
  pantalla(marcador(), tarjeta(
    etq("Nivel 1 · Mito o derecho · " + (i + 1) + " de " + ronda.mitos.length + (jug > 1 ? " · Turno " + jn(turno) : "")),
    h("div", { class: "reloj" }, h("div", { class: "t" }, h("span", {}, "Bono rapidez"), h("span", {}, "+" + R.rapidez)), h("div", { class: "barra" }, barra)),
    h("h2", {}, r.texto),
    ops
  ));
  voz("calma", jug > 1 ? "turno de " + jn(turno) : "¿mito o derecho?");
  arrancarReloj(barra);
}

function sumar(p, bien, t){
  respuestasNivel++;
  if (!bien) {
    rachas[p] = 0; stats[p].mal++;
    const o = dueno(p); if (vidas[o] > 0) vidas[o]--;
    return { bien, total: 0, rapidez: 0, racha: 0 };
  }
  aciertosNivel++; rachas[p]++; stats[p].bien++;
  if (t < 3) stats[p].rapido = true;
  const rapidez = Math.round(R.rapidez * Math.max(0, 1 - t / R.segundos));
  const racha = R.racha * (rachas[p] - 1);
  const total = R.acierto + rapidez + racha;
  puntos[p] += total;
  return { bien, total, rapidez, racha };
}

const correcta = r => (r.correcta || "").toLowerCase().trim();
function responder(v){
  const t = pararReloj();
  if (jug === 1) {
    const res = sumar(0, v === correcta(ronda.mitos[i]), t);
    resultados[i] = res.bien;
    resultadoSolo(res);
  } else {
    elecciones[turno] = v; tiempos[turno] = t;
    const nx = siguienteActivo(turno);
    if (nx >= 0) { const antes = turno; turno = nx; pasar(antes); } else revelar();
  }
}

function fichas(res){
  const c = h("div", { class: "chips" });
  if (res.bien) {
    c.appendChild(h("span", { class: "chip on" }, "+" + R.acierto + " acierto"));
    if (res.rapidez) c.appendChild(h("span", { class: "chip" }, "+" + res.rapidez + " rapidez"));
    if (res.racha) c.appendChild(h("span", { class: "chip" }, "+" + res.racha + " racha"));
  } else c.appendChild(h("span", { class: "chip perdida" }, "−1 vida"));
  return c;
}
function explicacion(r, bien){
  return h("div", { class: "resp" + (bien ? "" : " mal") }, h("b", {}, "Es " + (correcta(r) === "mito" ? "un mito" : "un derecho")), r.explicacion, h("div", { class: "ruta" }, r.ruta || ""));
}

function resultadoSolo(res){
  const r = ronda.mitos[i];
  pantalla(marcador(), tarjeta(
    etq("Nivel 1 · Mito o derecho · " + (i + 1) + " de " + ronda.mitos.length),
    h("h2", { class: res.bien ? "ok" : "mal-t" }, res.bien ? "¡Eso!" : "Esta vez no"),
    fichas(res),
    explicacion(r, res.bien),
    lineaMeta(),
    botonSeguirMito()
  ));
  if (res.bien) { sfx("bien"); salto("+" + res.total); confeti(); voz("feliz", "¡bien!"); }
  else { sfx("mal"); temblor(); voz("triste", "¡ánimo, se aprende!"); }
}

function pasar(antes){
  pantalla(marcador(), tarjeta(
    etq("Nivel 1 · Mito o derecho · " + (i + 1) + " de " + ronda.mitos.length),
    h("h2", {}, jn(antes) + " ya eligió"),
    h("p", { class: "lead", style: "margin-bottom:18px" }, "Pásale el celular a " + jn(turno) + ", nadie ve las respuestas hasta el final de la ronda"),
    boton("Soy " + jn(turno), null, pregunta, "prim")
  ));
  voz("calma", "pasa el celular");
}

function revelar(){
  const r = ronda.mitos[i], jugaron = [];
  for (let k = 0; k < jug; k++) if (elecciones[k] !== undefined) jugaron.push(k);
  const rs = {};
  jugaron.forEach(k => { rs[k] = sumar(k, elecciones[k] === correcta(r), tiempos[k]); });
  const n = jugaron.filter(k => rs[k].bien).length;
  resultados[i] = n * 2 >= jugaron.length;
  turno = 0;
  const filas = h("div", { class: "filas" });
  for (let k = 0; k < jug; k++) {
    filas.appendChild(rs[k]
      ? h("div", { class: "fila" }, h("span", {}, h("b", {}, jn(k)), " eligió " + (elecciones[k] === "mito" ? "mito" : "derecho")), h("span", { class: rs[k].bien ? "ok" : "mal-t" }, rs[k].bien ? "+" + rs[k].total : "−1 vida"))
      : h("div", { class: "fila" }, h("b", {}, jn(k)), h("span", { class: "s" }, "sin vidas, mira y aprende")));
  }
  let vidasVs = null;
  if (modo === "versus") {
    vidasVs = h("div", { class: "filas" });
    for (let k = 0; k < jug; k++) vidasVs.appendChild(h("div", { class: "fila" }, h("span", {}, "Vidas de " + jn(k)), corazones(vidas[k], maxVidas)));
  }
  pantalla(marcador(), tarjeta(
    etq("Nivel 1 · Mito o derecho · " + (i + 1) + " de " + ronda.mitos.length + " · Resultado"),
    h("h2", {}, n === jugaron.length ? "¡Todos acertaron!" : n === 0 ? "Esta vez nadie" : "Acertaron " + n + " de " + jugaron.length),
    explicacion(r, n > 0),
    filas, vidasVs,
    lineaMeta(),
    botonSeguirMito()
  ));
  if (n > 0) { sfx("bien"); confeti(); voz("feliz", n === jugaron.length ? "¡todos bien!" : "¡bien!"); }
  else { sfx("mal"); temblor(); voz("triste", "¡ánimo, se aprende!"); }
}

function botonSeguirMito(){
  const fuera = sinVidas();
  return boton(fuera ? "Continuar" : i < ronda.mitos.length - 1 ? "Seguir" : "Ver la meta", null, () => {
    i++; elecciones = []; tiempos = [];
    if (fuera) return sinVidasPantalla();
    if (i < ronda.mitos.length) { turno = siguienteActivo(-1); pregunta(); }
    else revisarNivel();
  }, "prim");
}

function reintentar(){
  return [boton("Reintentar el nivel 1", "Salen otros mitos o derechos", () => { reiniciar(); pregunta(); }, "prim"), boton("Volver al inicio", null, inicio)];
}

function elegir(k){
  const r = ronda.dilemas[j], perf = partes(r.correcta)[k] || "Observa";
  votos[perf] = (votos[perf] || 0) + 1;
  dilemasHechos[j] = true;
  puntos = puntos.map(p => p + R.aliado);
  pantalla(marcador(), tarjeta(
    etq("Nivel 2 · ¿Qué harías? · " + (j + 1) + " de " + ronda.dilemas.length),
    h("div", { class: "btn sel" }, partes(r.opciones)[k]),
    h("div", { class: "chips" }, h("span", { class: "chip on" }, "+" + R.aliado + " aliado" + (jug > 1 ? " c/u" : ""))),
    h("div", { class: "resp" }, h("b", {}, "Lo que pasa"), partes(r.explicacion)[k] || "", h("div", { class: "ruta" }, "Lo que aplicaba: " + (r.ruta || ""))),
    h("p", { class: "ruta" }, "Si vives algo parecido, en Bienestar Universitario pueden orientarte")
  ), boton(j < ronda.dilemas.length - 1 ? "Seguir" : "Ver el resultado", null, () => { j++; j < ronda.dilemas.length ? situacion() : final(); }, "prim"));
  sfx("elige"); salto("+" + R.aliado); voz("feliz", "+" + R.aliado + " aliado");
}

/* ================= Resultado ================= */
const perfilGanador = () => J.perfilDe(votos);
function insigniasDe(lista){
  const s = lista.reduce((a, p) => ({ bien: a.bien + stats[p].bien, mal: a.mal + stats[p].mal, rapido: a.rapido || stats[p].rapido }), { bien: 0, mal: 0, rapido: false });
  const out = [];
  if (s.mal === 0 && s.bien > 0) out.push(INSIGNIAS.perfecto);
  if (s.rapido) out.push(INSIGNIAS.rayo);
  if (s.mal > 0) out.push(INSIGNIAS.aprendiz);
  if (modo === "coop") out.push(INSIGNIAS.equipo);
  out.push(INSIGNIAS.aliado);
  return out;
}
function contar(nodo, hasta){
  if (quieto()) { nodo.textContent = hasta; return; }
  const t0 = performance.now();
  const paso = () => { const k = Math.min(1, (performance.now() - t0) / 1000); nodo.textContent = Math.round(hasta * k); if (k < 1) requestAnimationFrame(paso); };
  paso();
}

function final(){
  fase = "fin";
  const bono = vidas.map(v => v * R.vida);
  if (modo === "coop") puntos[0] += bono[0]; else bono.forEach((b, p) => { puntos[p] += b; });
  siguientePista = "victoria";
  const p = perfilGanador();
  let bloque, guardables = [];
  if (modo === "versus") {
    const cola = puntos.map((s, k) => ({ p: k, pts: s, nombre: jn(k) })).sort((a, b) => b.pts - a.pts || a.p - b.p);
    const top = cola[0].pts, lideres = cola.filter(q => q.pts === top);
    bloque = tarjeta(etq("Ranking del grupo"),
      h("h2", {}, lideres.length === jug ? "¡Empate entre todos!" : lideres.length > 1 ? "Empate entre " + lideres.map(q => q.nombre).join(" y ") : "¡Gana " + lideres[0].nombre + "!"),
      h("div", { class: "filas" }, cola.map(q => h("div", { class: "fila" },
        h("span", {}, h("b", {}, (cola.findIndex(x => x.pts === q.pts) + 1) + "º " + q.nombre), " ", h("span", { class: "s" }, rango(q.pts))),
        h("b", {}, q.pts + "")))),
      h("p", { class: "ruta" }, "Incluye +" + R.vida + " por cada vida que le quedó a cada jugador"));
    guardables = cola.filter(q => califica(q.pts));
  } else {
    const total = equipo(), porCabeza = modo === "coop" ? Math.round(total / jug) : total;
    const num = h("span", {}, "0");
    const lista = modo === "coop" ? [...Array(jug).keys()] : [0];
    bloque = tarjeta(etq(modo === "coop" ? "Resultado del equipo" : "Resultado final"),
      h("div", { class: "puntos" }, num, h("small", {}, " puntos")),
      h("span", { class: "rango" }, rango(porCabeza)),
      h("div", { class: "chips" }, h("span", { class: "chip" }, "+" + bono[0] + " bono vidas"), modo === "coop" ? h("span", { class: "chip" }, porCabeza + " por jugador") : null),
      etq("Insignias"),
      h("div", { class: "insignias" }, insigniasDe(lista).map(b => h("div", { class: "insignia" }, h("span", { class: "ic" }, icono(ICONOS[b.ic])), h("div", {}, h("b", {}, b.nombre), h("span", {}, b.d))))));
    requestAnimationFrame(() => contar(num, total));
    if (califica(total)) guardables = [{ p: 0, pts: total, nombre: modo === "coop" ? "Equipo" : "J1", coop: modo === "coop", titulo: rango(porCabeza) }];
  }
  const mejor = modo === "versus" ? Math.max(...puntos) : equipo();
  const msg = [
    (jug === 1 ? "Mi perfil" : modo === "coop" ? "El perfil de nuestro equipo" : "El perfil de nuestro grupo") + " de aliado en " + CONFIG.nombre + " es " + p.texto,
    p.explicacion,
    "Para mañana: " + p.opciones,
    jug === 1 ? "Hice " + mejor + " puntos" : modo === "coop" ? "Hicimos " + mejor + " puntos en equipo" : "El mejor puntaje fue " + mejor,
    "¿Te le mides? Juega aquí: " + location.href.split("#")[0]
  ].join("\n");
  pantalla(
    bloque,
    h("div", { class: "tarjeta borde" }, etq(jug === 1 ? "Tu forma de ser aliado" : "La forma de ser aliado del grupo"),
      h("div", { class: "perfil" }, p.texto), h("p", { class: "lead", style: "margin:12px 0 16px" }, p.explicacion),
      h("div", { class: "resp" }, h("b", {}, "Para hacer mañana"), p.opciones)),
    CONFIG.funciones.compartir ? h("a", { class: "btn prim", style: "text-align:center", target: "_blank", rel: "noopener", href: "https://wa.me/?text=" + encodeURIComponent(msg) }, "Compartir por WhatsApp") : null,
    CONFIG.funciones.compartir ? boton("Copiar el mensaje", null, () => copiar(msg)) : null,
    guardables.length ? boton(guardables.length > 1 ? "Guardar los récords" : "Guardar el récord", "Tres letras, pueden ser inventadas", () => iniciales(guardables, 0), CONFIG.funciones.compartir ? "" : "prim") : null,
    boton("Jugar otra vez", null, cuantos),
    h("div", { class: "dos chica" }, boton("Récords", null, () => records(inicio)), boton("Pregúntale", null, preguntale))
  );
  if (!musica) sfx("gana");
  confeti();
  voz("feliz", "¡perfil " + p.texto.toLowerCase() + "!", 4000);
}

function copiar(msg){
  const mostrar = () => {
    if (!$("#compartido")) $("#vista").appendChild(h("pre", { class: "compartido", id: "compartido" }, msg));
    $("#compartido").scrollIntoView({ block: "nearest" });
    voz("calma", "selecciona y copia");
  };
  try {
    if (!navigator.clipboard) return mostrar();
    navigator.clipboard.writeText(msg).then(() => voz("feliz", "¡mensaje copiado!", 2500), mostrar);
  } catch (e) { mostrar(); }
}

/* ================= Iniciales para los récords ================= */
const ABC = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
function iniciales(cola, idx){
  const q = cola[idx], letras = [0, 0, 0];
  let pos = 0;
  siguientePista = "victoria";
  const cajas = letras.map((_, k) => {
    const c = h("div", { class: "c" });
    const caja = h("div", { class: "letra" },
      h("button", { type: "button", "aria-label": "Letra anterior", on: () => { pos = k; cambiar(-1); } }, "▲"),
      c,
      h("button", { type: "button", "aria-label": "Letra siguiente", on: () => { pos = k; cambiar(1); } }, "▼"));
    c.addEventListener("click", () => { pos = k; pintar(); sfx("mueve"); });
    return { caja, c };
  });
  const pintar = () => cajas.forEach((o, k) => { o.c.textContent = ABC[letras[k]]; o.caja.classList.toggle("sel", k === pos); });
  const cambiar = d => { letras[pos] = (letras[pos] + ABC.length + d) % ABC.length; pintar(); sfx("mueve"); };
  const listo = () => idx + 1 < cola.length ? iniciales(cola, idx + 1) : records(inicio);
  pantalla(tarjeta(
    etq("Nuevo récord"),
    h("h2", {}, q.nombre + " · " + q.pts + " puntos"),
    h("p", { class: "ruta", style: "margin-bottom:6px" }, "Escriban tres letras, pueden ser inventadas"),
    h("div", { class: "letras" }, cajas.map(o => o.caja))
  ), boton("Guardar", null, () => {
    const r = cargarRecords();
    r.push({ ini: letras.map(n => ABC[n]).join(""), pts: q.pts, titulo: (q.titulo || rango(q.pts)) + (q.coop ? " · equipo" : "") });
    r.sort((a, b) => b.pts - a.pts);
    guardar("records", JSON.stringify(r.slice(0, 5)));
    sfx("gana"); voz("feliz", "¡nuevo récord!", 2500);
    listo();
  }, "prim"), boton("Saltar", null, listo));
  pintar();
}

/* ================= Récords ================= */
function records(volver){
  fase = "inicio"; enInicio = false;
  const r = cargarRecords();
  pantalla(
    h("button", { class: "volver", type: "button", on: () => { sfx("tap"); volver(); } }, "← Volver"),
    etq("Récords de este celular"),
    h("h2", {}, "Top 5"),
    r.length
      ? tarjeta(h("div", { class: "filas", style: "margin:0" }, r.map((x, k) => h("div", { class: "fila" }, h("span", {}, h("b", {}, (k + 1) + "º " + x.ini), " ", h("span", { class: "s" }, x.titulo)), h("b", {}, x.pts + "")))))
      : h("p", { class: "lead" }, "Todavía no hay récords, jueguen una partida y escriban sus iniciales al final"),
    boton("Jugar", null, cuantos, "prim")
  );
  voz("calma", "los mejores de este celular");
}

/* ================= Opciones: colores, música y efectos ================= */
function opciones(caja, volver){
  const enPausa = caja.id === "pausa";
  const pintar = () => {
    const filas = [
      h("button", { class: "volver", type: "button", on: () => { sfx("tap"); volver(); } }, "← Volver"),
      etq("Opciones"),
      h("h2", {}, "Colores"),
      Object.entries(PALETAS).map(([k, p]) => h("button", { class: "btn color" + (k === paleta ? " sel" : ""), type: "button", "aria-pressed": k === paleta ? "true" : "false",
        on: () => { ponerPaleta(k, true); sfx("tap"); voz("feliz", "colores " + p.nombre.toLowerCase()); pintar(); } },
        h("span", { class: "nom" }, p.nombre, h("small", {}, p.nota)),
        h("span", { class: "muestras", "aria-hidden": "true" }, [p.fondo, p.sup2, p.lima, p.texto].map(c => h("i", { style: "background:" + c }))))),
      h("h2", { style: "margin-top:12px" }, "Sonido"),
      h("button", { class: "btn", type: "button", on: () => { musica = !musica; guardar("musica", musica ? "si" : "no"); if (musica) sonar(); else callar(); sfx("tap"); pintar(); } },
        "Música", h("span", { class: "der" }, musica ? "Sí" : "No"), h("small", {}, "Una canción en el inicio, otra en el nivel 2 y otra en los resultados")),
      h("button", { class: "btn", type: "button", on: () => { efectos = !efectos; guardar("efectos", efectos ? "si" : "no"); sfx("tap"); pintar(); } },
        "Efectos", h("span", { class: "der" }, efectos ? "Sí" : "No"), h("small", {}, "Los sonidos al acertar, fallar y elegir")),
      CONFIG.funciones.accesible ? h("button", { class: "btn", type: "button", on: () => { alternarAcc(); sfx("tap"); pintar(); } },
        "Letra grande y alto contraste", h("span", { class: "der" }, document.body.classList.contains("accesible") ? "Sí" : "No")) : null,
      h("p", { class: "nota" }, "Todo se guarda solo en este celular")
    ];
    caja.replaceChildren(...filas.flat().filter(Boolean));
    if (!enPausa) window.scrollTo(0, 0);
  };
  if (!enPausa) { fase = "inicio"; enInicio = false; pararReloj(); cabecera(); }
  pintar();
}

/* ================= Pausa ================= */
let guardado = null;
const jugando = () => fase === "mitos" || fase === "dilemas";
function pausa(){
  if (pausado || fase === "inicio") return;
  guardado = { reloj: relojOn, dice: $("#dice").textContent };
  if (relojOn) { cancelAnimationFrame(raf); pausadoEn = performance.now(); }
  pausado = true;
  bajarMusica(VOL_BAJO);
  $("#vista").hidden = true; $("#pausa").hidden = false;
  cabecera(); sfx("tap"); voz("calma", "en pausa");
  menuPausa();
  window.scrollTo(0, 0);
}
function menuPausa(){
  $("#pausa").replaceChildren(
    etq("Pausa"),
    h("h2", {}, "¿Qué quieren hacer?"),
    boton("Seguir jugando", null, seguir, "prim"),
    boton("Opciones", "Colores, música y efectos", () => opciones($("#pausa"), menuPausa)),
    boton("Volver al inicio", jugando() ? "Se pierde la partida en curso" : null, jugando() ? confirmarSalida : salir)
  );
}
function confirmarSalida(){
  $("#pausa").replaceChildren(
    etq("Volver al inicio"),
    h("h2", {}, "¿Seguro que quieren salir?"),
    h("p", { class: "lead" }, "Los puntos de esta partida no se guardan"),
    boton("No, seguir jugando", null, seguir, "prim"),
    boton("Sí, volver al inicio", null, salir)
  );
}
function cerrarPausa(){ pausado = false; $("#pausa").hidden = true; $("#pausa").replaceChildren(); $("#vista").hidden = false; bajarMusica(VOL); }
function seguir(){
  const g = guardado;
  cerrarPausa();
  voz("calma", g.dice);
  if (g.reloj) { tInicio += performance.now() - pausadoEn; relojOn = true; correrReloj(); }
  cabecera();
}
function salir(){ cerrarPausa(); pararReloj(); inicio(); }

/* ================= Pregúntale y ayuda ================= */
function preguntale(){
  fase = "inicio"; enInicio = false;
  pararReloj();
  const lista = de("pregunta");
  $("#vista").innerHTML = `<button class="volver" onclick="inicio()">← Volver</button><h2>Pregúntale${CONFIG.personaje ? " a " + esc(CONFIG.personaje) : ""}</h2>
    <p class="lead" style="margin-bottom:14px">Respuestas cortas que siempre te llevan a la ruta oficial</p>
    ${CONFIG.funciones.buscador ? `<input class="buscar" id="q" placeholder="Escribe tu duda…" oninput="filtrar()">` : ""}
    <div class="faq" id="faq">${lista.map(r=>`<details data-t="${esc((r.texto+" "+r.explicacion).toLowerCase())}"><summary>${esc(r.texto)}</summary><p>${esc(r.explicacion)}<br><span class="ruta">→ ${esc(r.ruta||"Bienestar Universitario")}</span></p></details>`).join("")}</div>`;
  window.scrollTo(0,0);
  cabecera(); pista("tema");
  voz("calma", "pregúntame lo que quieras");
}

function filtrar(){
  const q = $("#q").value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  document.querySelectorAll("#faq details").forEach(d=>{
    const t = d.dataset.t.normalize("NFD").replace(/[̀-ͯ]/g,"");
    d.hidden = q && !q.split(" ").every(w=>t.includes(w));
  });
}

function abrirAyuda(){
  if (jugando() && !pausado) pausa();
  bajarMusica(VOL_BAJO);
  $("#hojaAyuda").innerHTML = `<h2>Aquí no estás solo</h2>${AYUDA.map(a=>`<div class="it"><b>${esc(a.t)}</b><br>${a.url?`<a href="${a.url}" target="_blank" rel="noopener">${esc(a.d)}</a>`:esc(a.d)}</div>`).join("")}
    <p class="nota">Este juego orienta, no reemplaza la ruta oficial</p><button class="btn" style="margin-top:14px" onclick="cerrarAyuda()">Cerrar</button>`;
  $("#modal").classList.add("on");
}
function cerrarAyuda(){ $("#modal").classList.remove("on"); if (!pausado) bajarMusica(VOL); }
function alternarAcc(){ document.body.classList.toggle("accesible"); guardar("accesible", document.body.classList.contains("accesible") ? "si" : "no"); }

/* ================= Arranque ================= */
$("#marca").addEventListener("click", () => { if (jugando()) pausa(); else if (!pausado) inicio(); });
$("#btnMenu").addEventListener("click", pausa);
$("#btnAcc").addEventListener("click", alternarAcc);
$("#btnAyuda").addEventListener("click", abrirAyuda);
$("#modal").addEventListener("click", e => { if (e.target === e.currentTarget) cerrarAyuda(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#modal").classList.contains("on")) return cerrarAyuda();
  if (pausado) seguir(); else if (fase !== "inicio") pausa();
});
ponerPaleta(leer("paleta") || "bosque");
if (CONFIG.funciones.accesible && leer("accesible") === "si") document.body.classList.add("accesible");
cabecera(); inicio();
cargarHoja().then(() => { if (enInicio) inicio(); });
</script>
</body>
</html>
